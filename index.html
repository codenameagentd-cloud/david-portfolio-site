<style>
.video-overlay-wrap{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10;opacity:0;transition:opacity 0.3s ease}
.video-overlay-wrap.active{opacity:1}
.video-overlay-wrap video{position:absolute;top:12%;left:18%;width:63%;height:auto;object-fit:cover}
</style>
<script>
(function(){
  function init(){
    var canvas=document.querySelector('.projects canvas');
    if(!canvas)return setTimeout(init,500);
    var wrap=document.createElement('div');
    wrap.className='video-overlay-wrap';
    var v=document.createElement('video');
    v.src='./img/copilot-demo.mp4';
    v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';
    v.setAttribute('playsinline','');
    wrap.appendChild(v);
    document.body.appendChild(wrap);
    var isPlaying=false;
    var sec=document.querySelector('.projects');
    sec.addEventListener('click',function(){
      if(isPlaying){wrap.classList.remove('active');v.pause();v.currentTime=0;isPlaying=false;}
      else{wrap.classList.add('active');v.play();isPlaying=true;}
    });
    document.addEventListener('click',function(e){
      if(isPlaying&&!sec.contains(e.target)){wrap.classList.remove('active');v.pause();v.currentTime=0;isPlaying=false;}
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
</body></html>
