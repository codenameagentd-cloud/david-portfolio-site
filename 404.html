.video-overlay-wrap{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}

.projects{position:relative}

<script>
(function(){
  function injectVideo(){
    var sec=document.querySelector('.projects');
    if(!sec)return setTimeout(injectVideo,500);
    // Don't double inject
    if(sec.querySelector('.video-overlay-wrap'))return;
    var wrap=document.createElement('div');
    wrap.className='video-overlay-wrap';
    var v=document.createElement('video');
    v.src='./img/copilot-demo.mp4';
    v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;
    v.setAttribute('playsinline','');
    v.setAttribute('webkit-playsinline','');
    wrap.appendChild(v);
    sec.style.position='relative';
    sec.appendChild(wrap);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',injectVideo);
  else injectVideo();
})();
</script>
</body></html>
